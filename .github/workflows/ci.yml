name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: docker compose config --quiet
      - run: docker build -t qvb-portfolio:test .
      - name: Container smoke test
        run: |
          docker run -d --name portfolio-ci --read-only --tmpfs /tmp:rw,size=32m --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:18080:8080 qvb-portfolio:test
          trap 'docker logs portfolio-ci; docker rm -f portfolio-ci' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ | grep -q 'Quentin Van Bever'
          PORTFOLIO_PREVIEW_URL=http://127.0.0.1:18080 CHECK_HTTP_404=1 npm run test:seo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/missing)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/assets/missing.js)" = 404
          curl -fsS http://127.0.0.1:18080/sitemap.xml | grep -q 'bifrost'
