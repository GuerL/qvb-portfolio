# Only successful Vite content-hashed assets are immutable. Keep errors and
# unversioned public resources revalidating. Defined at http scope by conf.d.
map "$status:$uri" $portfolio_cache_control {
  default "no-cache, must-revalidate";
  "~^(200|304):/assets/.+-[A-Za-z0-9_-]{8,}[.][^/]+$" "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header Cache-Control $portfolio_cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  # Nginx validators use mtime/size, which can collide across fast deployments.
  # Revalidated resources get a fresh body; immutable assets skip the request.
  etag off;
  if_modified_since off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location ^~ /assets/ { try_files $uri =404; }
  location ~* \.(js|css|map|json|woff2?|ttf|otf|pdf|png|svg|webp|avif|jpg|jpeg|gif|ico|xml|txt|webmanifest)$ { try_files $uri =404; }
  location / { try_files $uri $uri/index.html =404; }
  error_page 404 /404.html;
  location = /404.html { internal; }
}
