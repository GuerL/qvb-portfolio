server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location ~* \.(png|svg|webp|jpg|jpeg|ico|xml|txt)$ { try_files $uri =404; }
  location / { try_files $uri $uri/index.html =404; }
  error_page 404 /404.html;
  location = /404.html { internal; }
}
